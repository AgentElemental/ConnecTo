<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/button.css">
    <link rel="stylesheet" href="./css/chatPage.css">
    <link rel="stylesheet" href="./css/sign.css">
    <link rel="stylesheet" href="./css/menu.css">
    <style>
        /* Dark and light mode styling */
        body.dark-mode {
            background-color: #121212;
            color: #ffffff;
        }

        body.light-mode {
            background-color: #ffffff;
            color: #000000;
        }

        /* Toggle icon styling */
        #theme-toggle {
            cursor: pointer;
            font-size: 1.5em;
            margin-left: 10px;
        }

        /* Header styling for dark and light modes */
        header {
            width: 100%;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background-color 0.3s, color 0.3s;
        }

        body.dark-mode header {
            background-color: #1e1e1e;
            color: #ffffff;
        }

        body.light-mode header {
            background-color: #f1f1f1;
            color: #000000;
        }

        #chat-app {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #1f1f1f;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        #message-container {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #333;
            background-color: #2a2a2a;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message-container {
            display: flex;
            flex-direction: column;
            max-width: 75%;
            padding: 10px;
            border-radius: 15px;
            word-wrap: break-word;
        }

            .message-container.sent-message-container {
                align-self: flex-end;
                text-align: right;
            }

            .message-container.received-message-container {
                align-self: flex-start;
                text-align: left;
            }

        /* Profile picture with green border */
        .profile-pic {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid #4CAF50;
            margin-bottom: 5px;
        }

        .username {
            font-size: 0.85em;
            color: #aaaaaa;
            margin-bottom: 5px;
        }

        .sent-message {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border-radius: 15px 15px 0 15px;
        }

        .received-message {
            background-color: #333;
            color: #fff;
            padding: 10px 15px;
            border-radius: 15px 15px 15px 0;
        }
        /* Nav menu text color for light mode */
        body.light-mode #nav-menu a {
            color: black;
        }

        /* Mobile view hamburger menu */
        @media (max-width: 768px) {
            #hamburger-menu {
                display: inline-block;
            }

            #nav-menu {
                display: none;
                position: absolute;
                top: 60px;
                right: 10px;
                background-color: inherit;
                border-radius: 8px;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
                transition: background-color 0.3s, color 0.3s;
                width: 200px;
                text-align: center;
            }

            /* Dark mode for dropdown menu */
            body.dark-mode #nav-menu {
                background-color: #1e1e1e;
                color: #ffffff;
                border: 1px solid #333333;
            }

            /* Light mode for dropdown menu */
            body.light-mode #nav-menu {
                background-color: #f9f9f9;
                color: #000000;
                border: 1px solid #cccccc;
            }

            /* Dropdown menu links */
            #nav-menu ul {
                list-style-type: none;
                padding: 10px;
                margin: 0;
            }

                #nav-menu ul li {
                    padding: 10px 0;
                }

                    #nav-menu ul li a {
                        color: inherit;
                        text-decoration: none;
                    }

            /* Center-align theme toggle button in dropdown */
            #nav-menu #theme-toggle {
                display: block;
                margin: 10px auto;
            }
        }
        /* Light mode styling for chat-app */
        body.light-mode #chat-app {
            background-color: #f9f9f9; /* Light background for chat app */
            border: 1px solid #cccccc; /* Light border */
            color: #000000; /* Text color */
        }

        /* Light mode styling for message container */
        body.light-mode #message-container {
            background-color: #ffffff; /* White background */
            border: 1px solid #cccccc; /* Light grey border */
        }

        /* Light mode styling for message */
        body.light-mode .message-container.sent-message-container .sent-message {
            background-color: #4CAF50; /* Green background */
            color: white; /* White text */
        }

        body.light-mode .message-container.received-message-container .received-message {
            background-color: #e0e0e0; /* Light grey background for received messages */
            color: #000; /* Black text for received messages */
        }

        /* Input field style for light mode */
        body.light-mode #message-input {
            background-color: #ffffff; /* White background */
            color: #000000; /* Black text */
            border: 1px solid #cccccc; /* Light border */
        }

            body.light-mode #message-input::placeholder {
                color: #888888; /* Light grey placeholder text */
            }
    </style>
</head>

<body>
    <header>
        <a href="index.html">
            <h2>ConnecTo</h2>
        </a>
        <center>
            <div id="hamburger-menu" onclick="toggleMenu()">&#9776;</div>
            <nav id="nav-menu">
                <ul>
                    <li><a href="index.html" class="active">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="chat.html">Chat</a></li>
                </ul>
                <a id="signin-link">
                    <button id="signin-button">Sign In</button>
                    <button id="signout-button" style="display: none;">Sign Out</button>
                    <img id="profile-pic" alt="Profile Picture">
                </a>
                <!-- Theme toggle icon placed next to Sign In button -->
                <div id="theme-toggle" onclick="toggleTheme()">🌙</div>
            </nav>
        </center>
    </header>
    <p id="roomId"></p>
    <div id="chat-app">
        <div id="message-container">
            <!-- Messages will be dynamically generated here -->
        </div>

        <!-- Message input form -->
        <form id="form">
            <input type="text" id="message-input" placeholder="Type your message..." required>
            <button id="send-button" type="submit">Send</button>
        </form>
        <p id="error-message"></p>
    </div>
    <div class="routes">
    </div>
    <script src="./app/app.mjs" type="module"></script>
    <script src="./js/menu.js"></script>

    <!-- Firebase configuration and script -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script type="module" src="./js/authentication.mjs"></script>
    <script>
        // Set initial theme based on saved preference or default to dark mode
        document.addEventListener('DOMContentLoaded', function () {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            setTheme(savedTheme);
        });

        // Theme toggle function
        function toggleTheme() {
            const currentTheme = document.body.classList.contains('dark-mode') ? 'dark' : 'light';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            setTheme(newTheme);
            localStorage.setItem('theme', newTheme); // Save user preference
        }

        // Function to set the theme and toggle icon
        function setTheme(theme) {
            if (theme === 'dark') {
                document.body.classList.add('dark-mode');
                document.body.classList.remove('light-mode');
                document.getElementById('theme-toggle').textContent = '🌞';
            } else {
                document.body.classList.add('light-mode');
                document.body.classList.remove('dark-mode');
                document.getElementById('theme-toggle').textContent = '🌙';
            }
        }

    </script>

</body>

</html>
