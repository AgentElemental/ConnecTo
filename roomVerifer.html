<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnecTo</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/button.css">
    <link rel="stylesheet" href="./css/roomVerifier.css">
    <link rel="stylesheet" href="./css/sign.css">
    <link rel="stylesheet" href="./css/menu.css">
    <style>
        /* Dark and light mode styling */
        body.dark-mode {
            background-color: #121212;
            color: #ffffff;
        }

        body.light-mode {
            background-color: #ffffff;
            color: #000000;
        }

        /* Toggle icon styling */
        #theme-toggle {
            cursor: pointer;
            font-size: 1.5em;
            margin-left: 10px;
        }

        /* Header styling for dark and light modes */
        header {
            width: 100%;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background-color 0.3s, color 0.3s;
        }

        body.dark-mode header {
            background-color: #1e1e1e;
            color: #ffffff;
        }

        body.light-mode header {
            background-color: #f1f1f1;
            color: #000000;
        }

        /* Styling for room-id element */
        #room-id {
            font-size: 1.2em;
            padding: 10px;
            margin: 20px auto;
            border-radius: 8px;
            max-width: 80%;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s, color 0.3s;
        }

        /* Dark mode styling for room-id */
        body.dark-mode #room-id {
            background-color: #333333;
            color: #ffffff;
            border: 1px solid #555555;
        }

        /* Light mode styling for room-id */
        body.light-mode #room-id {
            background-color: #f9f9f9;
            color: #000000;
            border: 1px solid #cccccc;
        }

        /* Nav menu text color for light mode */
        body.light-mode #nav-menu a {
            color: black;
        }

        /* Mobile view hamburger menu */
        @media (max-width: 768px) {
            #hamburger-menu {
                display: inline-block;
            }

            #nav-menu {
                display: none;
                position: absolute;
                top: 60px;
                right: 10px;
                background-color: inherit;
                border-radius: 8px;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
                transition: background-color 0.3s, color 0.3s;
                width: 200px;
                text-align: center;
            }

            /* Dark mode for dropdown menu */
            body.dark-mode #nav-menu {
                background-color: #1e1e1e;
                color: #ffffff;
                border: 1px solid #333333;
            }

            /* Light mode for dropdown menu */
            body.light-mode #nav-menu {
                background-color: #f9f9f9;
                color: #000000;
                border: 1px solid #cccccc;
            }

            /* Dropdown menu links */
            #nav-menu ul {
                list-style-type: none;
                padding: 10px;
                margin: 0;
            }

                #nav-menu ul li {
                    padding: 10px 0;
                }

                    #nav-menu ul li a {
                        color: inherit;
                        text-decoration: none;
                    }

            /* Center-align theme toggle button in dropdown */
            #nav-menu #theme-toggle {
                display: block;
                margin: 10px auto;
            }
        }
        /* Dark mode styling for verifier */
        body.dark-mode #verifier {
            background-color: #333333;
            color: #ffffff;
            border: 1px solid #555555;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        /* Light mode styling for verifier */
        body.light-mode #verifier {
            background-color: #f9f9f9;
            color: #000000;
            border: 1px solid #cccccc;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        /* Dark mode styling for label and input */
        body.dark-mode #verifier label {
            color: #ffffff;
        }

        body.dark-mode #id-verifier-input {
            color: #ffffff;
            background-color: #333333;
            border: 1px solid #555555;
        }

        /* Light mode styling for label and input */
        body.light-mode #verifier label {
            color: #000000; /* black color for the label */
        }

        body.light-mode #id-verifier-input {
            color: #000000; /* text color */
            background-color: #ffffff; /* white background */
            border: 1px solid #cccccc; /* light grey border */
        }

            /* Placeholder color for light mode input */
            body.light-mode #id-verifier-input::placeholder {
                color: #9e9e9e; /* black placeholder text */
            }

        body.dark-mode #id-verifier-input::placeholder {
            color: #aaaaaa; /* light grey placeholder text for dark mode */
        }
    </style>

</head>

<body>
    <header>
        <a href="index.html">
            <h2>ConnecTo</h2>
        </a>
        <center>
            <div id="hamburger-menu" onclick="toggleMenu()">&#9776;</div>
            <nav id="nav-menu">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="chat.html" class="active">Chat</a></li>
                </ul>
                <a id="signin-link">
                    <button id="signin-button">Sign In</button>
                    <button id="signout-button" style="display: none;">Sign Out</button>
                    <img id="profile-pic" alt="Profile Picture">
                </a>
                <!-- Theme toggle icon placed next to Sign In button -->
                <div id="theme-toggle" onclick="toggleTheme()">🌙</div>
            </nav>
        </center>
    </header>
    <div id="verifier">
        <label for="id-verifier">Enter Room ID </label>
        <input type="text" name="id-verifier" id="id-verifier-input" placeholder="Enter Room ID">
        <center>
            <button id="verify-button">Verify</button>
            <p id="error-message"></p>
        </center>
    </div>
    <script src="./app/verifer.mjs" type="module"></script>
    <!-- Firebase configuration and script -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script type="module" src="./js/authentication.mjs"></script>
    <script src="./js/menu.js"></script>
    <script>
        // Set default theme to dark mode
        document.addEventListener('DOMContentLoaded', function () {
            const userPrefersDark = localStorage.getItem('theme') === 'dark' || !localStorage.getItem('theme');
            if (userPrefersDark) {
                document.body.classList.add('dark-mode');
                document.getElementById('theme-toggle').textContent = '🌞';
            } else {
                document.body.classList.add('light-mode');
                document.getElementById('theme-toggle').textContent = '🌙';
            }
        });

        // Toggle theme between dark and light
        function toggleTheme() {
            const isDarkMode = document.body.classList.contains('dark-mode');
            if (isDarkMode) {
                document.body.classList.remove('dark-mode');
                document.body.classList.add('light-mode');
                document.getElementById('theme-toggle').textContent = '🌙';
                localStorage.setItem('theme', 'light');
            } else {
                document.body.classList.remove('light-mode');
                document.body.classList.add('dark-mode');
                document.getElementById('theme-toggle').textContent = '🌞';
                localStorage.setItem('theme', 'dark');
            }
        }

        // Toggle hamburger menu display
        function toggleMenu() {
            const navMenu = document.getElementById('nav-menu');
            navMenu.style.display = navMenu.style.display === 'block' ? 'none' : 'block';
        }
    </script>

</body>

</html>
