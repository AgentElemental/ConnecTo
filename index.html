<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnecTo</title>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/button.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/sign.css">
    <link rel="stylesheet" href="./css/menu.css">
    <style>
        /* Dark and light mode styling */
        body.dark-mode {
            background-color: #121212;
            color: #ffffff;
        }

        body.light-mode {
            background-color: #ffffff;
            color: #000000;
        }
        /* Toggle icon styling */
        #theme-toggle {
            cursor: pointer;
            font-size: 1.5em;
            margin-left: 10px;
        }
    </style>
</head>

<body>
    <header>
        <a href="index.html">
            <h2>ConnecTo</h2>
        </a>
        <center>
            <div id="hamburger-menu" onclick="toggleMenu()">&#9776;</div>
            <nav id="nav-menu">
                <ul>
                    <li><a href="index.html" class="active">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="chat.html">Chat</a></li>
                </ul>
                <a id="signin-link">
                    <button id="signin-button">Sign In</button>
                    <img id="profile-pic" alt="Profile Picture">
                </a>
                <!-- Theme toggle icon placed next to Sign In button -->
                <div id="theme-toggle" onclick="toggleTheme()">🌙</div>
            </nav>
        </center>
    </header>

    <center>
        <h1>Welcome to ConnecTo</h1>
        <a href="roomCreatingPage.html">
            <button>Create a room</button>
        </a>
        <a href="roomVerifer.html">
            <button>Join a room</button>
        </a>
    </center>

    <!-- Firebase configuration and script -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script type="module" src="./js/authentication.mjs"></script>
    <script src="./js/menu.js"></script>

    <script>
        // Set default theme to dark mode
        document.addEventListener('DOMContentLoaded', function () {
            const userPrefersDark = localStorage.getItem('theme') === 'dark' || !localStorage.getItem('theme');
            if (userPrefersDark) {
                document.body.classList.add('dark-mode');
                document.getElementById('theme-toggle').textContent = '🌞';
            } else {
                document.body.classList.add('light-mode');
                document.getElementById('theme-toggle').textContent = '🌙';
            }
        });

        // Toggle theme between dark and light
        function toggleTheme() {
            const isDarkMode = document.body.classList.contains('dark-mode');
            if (isDarkMode) {
                document.body.classList.remove('dark-mode');
                document.body.classList.add('light-mode');
                document.getElementById('theme-toggle').textContent = '🌙';
                localStorage.setItem('theme', 'light');
            } else {
                document.body.classList.remove('light-mode');
                document.body.classList.add('dark-mode');
                document.getElementById('theme-toggle').textContent = '🌞';
                localStorage.setItem('theme', 'dark');
            }
        }
    </script>
</body>
</html>
