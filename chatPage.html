<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <!-- <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script> -->
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/button.css">
    <link rel="stylesheet" href="./css/chatPage.css">
    <link rel="stylesheet" href="./css/sign.css">
    <link rel="stylesheet" href="./css/menu.css">
    <style>
        /* Dark and light mode styling */
        body.dark-mode {
            background-color: #121212;
            color: #ffffff;
        }

        body.light-mode {
            background-color: #ffffff;
            color: #000000;
        }

        /* Toggle icon styling */
        #theme-toggle {
            cursor: pointer;
            font-size: 1.5em;
            margin-left: 10px;
        }

        /* Content box styling */
        .content-box {
            padding: 20px;
            margin: 20px;
            border-radius: 8px;
            max-width: 600px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* Dark mode content box */
        body.dark-mode .content-box {
            background-color: #1e1e1e;
            color: #ffffff;
            border: 1px solid #333333;
        }

        /* Light mode content box */
        body.light-mode .content-box {
            background-color: #f9f9f9;
            color: #000000;
            border: 1px solid #cccccc;
        }
    </style>
</head>

<body>
    <header>
        <a href="index.html">
            <h2>ConnecTo</h2>
        </a>
        <center>
            <!-- Hamburger menu icon for mobile view -->
            <div id="hamburger-menu" onclick="toggleMenu()">
                &#9776; <!-- Hamburger icon -->
            </div>
            <!-- Navigation menu and sign-in button -->
            <nav id="nav-menu">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="chat.html" class="active">Chat</a></li>
                </ul>
                <a id="signin-link">
                    <button id="signin-button">Sign In</button>
                    <img id="profile-pic" alt="Profile Picture">
                </a>
                <!-- Theme toggle icon placed next to Sign In button -->
                <div id="theme-toggle" onclick="toggleTheme()">🌙</div>
            </nav>
        </center>
    </header>
    <p id="roomId"></p>
    <div id="chat-app">
        <div id="message-container"></div>
        <div id="media-input"></div>
        <form id="form">
            <input type="text" id="username" placeholder="Type your username..." required>
            <input type="text" id="message-input" placeholder="Type your message..." required>
            <button id="send-button" type="submit">Send</button>
        </form>
        <p id="error-message"></p>
    </div>
    <div class="routes">
    </div>
    <script src="./app/app.mjs" type="module"></script>
    <script src="./js/menu.js"></script>

    <!-- Firebase configuration and script -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script type="module" src="./js/authentication.mjs"></script>
    <script>
        // Set default theme to dark mode
        document.addEventListener('DOMContentLoaded', function () {
            const userPrefersDark = localStorage.getItem('theme') === 'dark' || !localStorage.getItem('theme');
            if (userPrefersDark) {
                document.body.classList.add('dark-mode');
                document.getElementById('theme-toggle').textContent = '🌞';
            } else {
                document.body.classList.add('light-mode');
                document.getElementById('theme-toggle').textContent = '🌙';
            }
        });

        // Toggle theme between dark and light
        function toggleTheme() {
            const isDarkMode = document.body.classList.contains('dark-mode');
            if (isDarkMode) {
                document.body.classList.remove('dark-mode');
                document.body.classList.add('light-mode');
                document.getElementById('theme-toggle').textContent = '🌙';
                localStorage.setItem('theme', 'light');
            } else {
                document.body.classList.remove('light-mode');
                document.body.classList.add('dark-mode');
                document.getElementById('theme-toggle').textContent = '🌞';
                localStorage.setItem('theme', 'dark');
            }
        }
    </script>

</body>

</html>
